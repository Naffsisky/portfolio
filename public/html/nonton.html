<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nonton Webinap</title>
    <style>
      :root {
        --bg: #fcfcfd;
        --panel: #ffffff;
        --muted: #627084;
        --accent: #2463eb;
        --text: #182438;
        --border: #e0e6ed;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial;
      }
      .app {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: calc(100vh - 95px);
        max-width: 1200px;
        margin: 30px auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .brand {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
      }
      .cfg {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        display: grid;
        gap: 10px;
      }
      .cfg select,
      .cfg input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      .search {
        padding: 10px 12px;
      }
      .search input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      .list {
        overflow: auto;
        padding: 6px;
      }
      .item {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .item:hover {
        background: #f0f5fc;
        border-color: var(--border);
      }
      .item.active {
        background: #edf4ff;
        border-color: #aac6f8;
      }
      .idx {
        opacity: 0.7;
        min-width: 36px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .now {
        padding: 10px 12px;
        color: var(--muted);
        font-size: 12px;
        border-bottom: 1px solid var(--border);
      }
      .video-wrap {
        position: relative;
        background: #000;
        aspect-ratio: 16/9;
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px;
        border-top: 1px solid var(--border);
        background: #f0f5fc;
        flex-wrap: wrap;
      }
      .controls button,
      .controls select {
        background: white;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
      }
      .controls .grow {
        flex: 1;
      }
      .footer {
        padding: 8px 12px;
        color: var(--muted);
        font-size: 12px;
        border-top: 1px solid var(--border);
      }
      html { scroll-padding-top: 120px; }
      .site-header { position: sticky; top: 0; z-index: 50; background: #fcfcfdf2; backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
      .site-header-inner { width: min(1200px, calc(100% - 96px)); min-height: 76px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
      .site-menu { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 100%; }
      .menu-toggle { display: none; }
      .menu-toggle[aria-expanded="false"] .close-icon, .menu-toggle[aria-expanded="true"] .menu-icon { display: none; }
      .site-header nav { display: flex; align-items: center; height: 76px; gap: 33px; }
      .site-header nav a { display: flex; align-items: center; height: 100%; color: var(--muted); text-decoration: none; font-size: 13px; border-bottom: 2px solid transparent; }
      .site-header nav a:hover { color: var(--accent); border-bottom-color: var(--accent); }
      .site-resume { padding: 9px 16px; border: 1px solid var(--border); border-radius: 7px; color: var(--text); text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; }
      a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      #baseShow { overflow-wrap: anywhere; }
      @media (max-width: 1296px) { .app { margin-inline: 24px; } }
      @media (max-width: 1100px) { .site-header-inner { width: calc(100% - 64px); } }
      @media (max-width: 850px) {
        .site-header-inner { min-height: 68px; flex-wrap: wrap; justify-content: flex-end; gap: 0; padding-block: 12px; }
        .menu-toggle { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 7px; color: var(--text); background: white; cursor: pointer; }
        .site-menu { display: none; flex-direction: column; align-items: stretch; gap: 12px; padding-block: 12px; max-height: calc(100dvh - 92px); overflow-y: auto; }
        .menu-toggle[aria-expanded="true"] + .site-menu { display: flex; }
        .site-header nav { height: auto; flex-direction: column; align-items: stretch; gap: 0; }
        .site-header nav a { min-height: 44px; padding: 10px 6px; }
        .site-resume { display: flex; align-items: center; justify-content: center; min-height: 44px; }
      }
      @media (max-width: 600px) {
        .site-header-inner { width: calc(100% - 40px); }
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          order: 2;
        }
        .player {
          order: 1;
        }
        .app { margin-inline: 20px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <button type="button" class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="header-menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path class="menu-icon" d="M4 6h16M4 12h16M4 18h16" /><path class="close-icon" d="m6 6 12 12M6 18 18 6" /></svg>
        </button>
        <div class="site-menu" id="header-menu">
          <nav aria-label="Main navigation"><a href="/">Home</a><a href="/about">About</a><a href="/projects">Projects</a><a href="/blog">Blog</a><a href="/certificates">Certificates</a></nav>
          <a class="site-resume" href="/cv">View résumé ↗</a>
        </div>
      </div>
    </header>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">Playlist Drama</div>
        <div class="cfg">
          <label>
            Pilih Seri:
            <select id="series"></select>
          </label>
          <div style="font-size: 12px; color: var(--muted)">Base: <span id="baseShow"></span></div>
        </div>
        <div class="search"><input id="q" aria-label="Cari episode" placeholder="Cari judul episode..." /></div>
        <div class="list" id="list"></div>
        <div class="footer">⌨️ K/Space: Play/Pause • J/L: ±10s • N/P: Next/Prev • [ ]: Speed</div>
      </aside>

      <main class="player">
        <div class="now">Memutar: <span id="nowTitle">-</span></div>
        <div class="video-wrap"><video id="vid" controls playsinline preload="metadata"></video></div>
        <div class="controls">
          <button id="prev">⏮ Prev</button>
          <button id="next">Next ⏭</button>
          <div class="grow"></div>
          <label
            >Speed
            <select id="rate">
              <option>0.5</option>
              <option>0.75</option>
              <option selected>1.0</option>
              <option>1.25</option>
              <option>1.5</option>
              <option>1.75</option>
              <option>2.0</option>
            </select>
          </label>
          <button id="reset">Reset Progress</button>
        </div>
      </main>
    </div>

    <script>
      const menuToggle = document.querySelector('.menu-toggle')
      function setMenuOpen(open) {
        menuToggle.setAttribute('aria-expanded', String(open))
        menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu')
      }
      menuToggle.addEventListener('click', () => setMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true'))
      document.querySelector('.site-header').addEventListener('keydown', event => {
        if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
          setMenuOpen(false)
          menuToggle.focus()
        }
      })
      document.querySelector('.site-menu').addEventListener('click', event => {
        if (event.target.closest('a')) setMenuOpen(false)
      })
      // ====== KONFIGURASI SERI KAMU ======
      const SERIES = [
        {
          name: 'Identitas Rahasia Sang Pewaris',
          base: 'https://is3.cloudhost.id/napmovie/Identitas-Rahasia-Sang-Pewaris',
          count: 63,
          pattern: (i) => `ep-${String(i).padStart(3, '0')}.mp4`,
        },
        {
          name: 'Pesona Istri Manis Sang Ceo',
          base: 'https://is3.cloudhost.id/napmovie/Pesona-Istri-Manis-Sang-Ceo',
          count: 80,
          pattern: (i) => `ep-${String(i).padStart(3, '0')}.mp4`,
        },
        {
          name: 'Kembalinya Sang Putra Pewaris',
          base: 'https://is3.cloudhost.id/napmovie/Kembalinya-Sang-Putra-Pewaris',
          count: 96,
          pattern: (i) => `ep-${String(i).padStart(3, '0')}.mp4`,
        },
        {
          name: 'Istriku Dari Masa Depan',
          base: 'https://is3.cloudhost.id/napmovie/Istriku-Dari-Masa-Depan',
          count: 99,
          pattern: (i) => `ep-${String(i).padStart(3, '0')}.mp4`,
        },
      ]

      // ====== APP ======
      const $ = (id) => document.getElementById(id)
      const seriesSel = $('series'),
        listEl = $('list'),
        video = $('vid'),
        q = $('q')
      const nowTitle = $('nowTitle'),
        rateSel = $('rate'),
        prevBtn = $('prev'),
        nextBtn = $('next'),
        resetBtn = $('reset'),
        baseShow = $('baseShow')

      const storeKey = (k) => `s3player::${k}`
      const save = (k, v) => localStorage.setItem(storeKey(k), JSON.stringify(v))
      const load = (k, def) => {
        try {
          return JSON.parse(localStorage.getItem(storeKey(k))) ?? def
        } catch {
          return def
        }
      }

      let items = [] // daftar episode aktif
      let cur = 0 // index episode aktif
      let progTimer // simpan progress

      // init dropdown seri
      SERIES.forEach((s, i) => {
        const opt = document.createElement('option')
        opt.value = i
        opt.textContent = s.name
        seriesSel.appendChild(opt)
      })
      seriesSel.value = load('lastSeriesIndex', 0)

      function buildItemsFromSeries(idx) {
        const s = SERIES[idx]
        baseShow.textContent = s.base
        const arr = []
        for (let i = 1; i <= s.count; i++) {
          const file = s.pattern(i)
          arr.push({ title: `${s.name} — Episode ${String(i).padStart(2, '0')}`, url: `${s.base}/${file}` })
        }
        return arr
      }

      function renderList() {
        const term = (q.value || '').toLowerCase()
        listEl.innerHTML = ''
        items.forEach((it, i) => {
          if (term && !it.title.toLowerCase().includes(term)) return
          const row = document.createElement('div')
          row.className = 'item' + (i === cur ? ' active' : '')
          row.dataset.i = i
          row.innerHTML = `<div class="idx">${String(i + 1).padStart(3, '0')}</div>
                         <div class="title" title="${it.title}">${it.title}</div>`
          row.onclick = () => playAt(i)
          listEl.appendChild(row)
        })
      }

      function updateActive() {
        ;[...listEl.children].forEach((ch) => ch.classList.toggle('active', Number(ch.dataset.i) === cur))
        nowTitle.textContent = items[cur]?.title || '-'
      }

      function playAt(i) {
        cur = i
        const it = items[i]
        if (!it) return
        updateActive()
        const progKey = `${seriesSel.value}|${it.url}`
        const last = load('progress', {})[progKey] || 0
        video.src = it.url
        video.playbackRate = parseFloat(rateSel.value || '1') || 1
        video.currentTime = Math.max(0, last - 1)
        video.play().catch(() => {})
        save('lastIndex:' + seriesSel.value, cur)
      }

      function next() {
        if (cur + 1 < items.length) playAt(cur + 1)
      }
      function prev() {
        if (cur - 1 >= 0) playAt(cur - 1)
      }

      function startProgressTimer() {
        clearInterval(progTimer)
        progTimer = setInterval(() => {
          const it = items[cur]
          if (!it) return
          const key = `${seriesSel.value}|${it.url}`
          const map = load('progress', {})
          map[key] = Math.floor(video.currentTime || 0)
          save('progress', map)
        }, 3000)
      }

      // events
      q.addEventListener('input', renderList)
      rateSel.addEventListener('change', () => (video.playbackRate = parseFloat(rateSel.value || '1') || 1))
      nextBtn.addEventListener('click', next)
      prevBtn.addEventListener('click', prev)
      resetBtn.addEventListener('click', () => {
        localStorage.removeItem(storeKey('progress'))
        alert('Progress dihapus ✅')
      })
      video.addEventListener('ended', next)
      video.addEventListener('play', startProgressTimer)
      video.addEventListener('pause', startProgressTimer)
      window.addEventListener('keydown', (e) => {
        if (e.target.matches('input, textarea, button, select, a')) return
        const k = e.key.toLowerCase()
        if (k === 'k' || e.code === 'Space') {
          e.preventDefault()
          video.paused ? video.play() : video.pause()
        }
        if (k === 'j') {
          video.currentTime = Math.max(0, video.currentTime - 10)
        }
        if (k === 'l') {
          video.currentTime = Math.min((video.duration || 1) - 0.1, video.currentTime + 10)
        }
        if (k === 'n') next()
        if (k === 'p') prev()
        if (e.key === '[') {
          video.playbackRate = Math.max(0.25, video.playbackRate - 0.25)
          rateSel.value = video.playbackRate.toFixed(2).replace(/0+$/, '').replace(/\.$/, '')
        }
        if (e.key === ']') {
          video.playbackRate = Math.min(3, video.playbackRate + 0.25)
          rateSel.value = video.playbackRate.toFixed(2).replace(/0+$/, '').replace(/\.$/, '')
        }
      })

      // load initial
      function loadSeries(idx) {
        items = buildItemsFromSeries(idx)
        cur = Math.min(load('lastIndex:' + idx, 0), items.length - 1)
        renderList()
        playAt(cur)
        save('lastSeriesIndex', idx)
      }
      seriesSel.addEventListener('change', () => loadSeries(Number(seriesSel.value)))
      loadSeries(Number(seriesSel.value))
    </script>
  </body>
</html>
